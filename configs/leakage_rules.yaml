# =============================================================================
# Feature Eligibility & Leakage Rules
# =============================================================================
#
# Project
#   Credit Risk / Loan Default Prediction
#
# Purpose
#   Defines the eligibility of every dataset feature for model training.
#
# Modeling Assumption
#   The model predicts loan default at the time of loan application
#   (pre-approval underwriting).
#
# Decision Types
#   KEEP     : Safe to use for model training.
#   REVIEW   : Requires business review before inclusion.
#   DROP     : Excluded due to administrative, identifier, or project-specific reasons.
#   LEAKAGE  : Information unavailable at prediction time.
#   TARGET   : Prediction target.
#
# =============================================================================

# =============================================================================
# Target
# =============================================================================

loan_status:
  decision: TARGET
  reason: Prediction target.


# =============================================================================
# Loan Application
# =============================================================================

loan_amnt:
  decision: KEEP
  reason: Requested loan amount available at application.


funded_amnt:
  decision: REVIEW
  reason: Approved loan amount; depends on the intended prediction stage.


funded_amnt_inv:
  decision: REVIEW
  reason: Investor-funded amount may not be finalized at application.


term:
  decision: KEEP
  reason: Loan term selected during application.


int_rate:
  decision: REVIEW
  reason: Assigned during underwriting; depends on deployment scenario.


installment:
  decision: REVIEW
  reason: Derived from approved loan terms and interest rate.


issue_d:
  decision: REVIEW
  reason: Loan issue date; availability depends on prediction timing.


purpose:
  decision: KEEP
  reason: Applicant-selected loan purpose.


title:
  decision: KEEP
  reason: Free-text loan title that overlaps with purpose.


initial_list_status:
  decision: REVIEW
  reason: LendingClub listing status requiring business interpretation.


application_type:
  decision: KEEP
  reason: Indicates whether the application is individual or joint.


disbursement_method:
  decision: DROP
  reason: Constant administrative field with no predictive value in this dataset.


